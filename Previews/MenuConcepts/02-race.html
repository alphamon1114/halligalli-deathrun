<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>할리갈리런 — 시안 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
  body { font-family: "Malgun Gothic", Arial, sans-serif; color: #251e19; background: #f3e9d5; }
  button { font: inherit; cursor: default; }
  .canvas { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #f3e9d5; }
  .canvas::before { content: ""; position: absolute; inset: 0 0 auto; height: 9px; background: #d9572b; }
  .topline { position: absolute; left: 46px; right: 46px; top: 28px; height: 39px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 2px solid #251e19; }
  .brandline { font: 900 13px/1 Arial, sans-serif; letter-spacing: .18em; }
  .topnote { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #665a4d; }
  .identity { position: absolute; top: 91px; left: 46px; width: 475px; }
  h1 { margin: 0; font-size: 76px; font-weight: 900; letter-spacing: -.075em; line-height: 1.1; }
  .menu { position: absolute; top: 222px; left: 46px; width: 466px; }
  .primary, .secondary, .tile, .character { width: 100%; border: 0; text-align: left; }
  .primary { position: relative; height: 83px; padding: 14px 24px; color: #fff8eb; background: #b84325; clip-path: polygon(0 0, 100% 0, 100% 76%, 96% 100%, 0 100%); }
  .primary strong { display: block; font-size: 27px; line-height: 1.2; letter-spacing: -.04em; }
  .primary small { display: block; margin-top: 5px; color: #fff8eb; font-size: 14px; font-weight: 700; }
  .arrow { position: absolute; right: 25px; top: 21px; font: 400 36px/1 Arial, sans-serif; }
  .secondary { position: relative; height: 57px; margin-top: 9px; padding: 0 20px; background: #251e19; color: #fff8eb; font-size: 17px; font-weight: 800; }
  .secondary .arrow-small, .character .arrow-small { position: absolute; right: 20px; top: 13px; font: 26px/1 Arial, sans-serif; }
  .pair { display: flex; gap: 9px; margin-top: 9px; }
  .tile, .character { position: relative; height: 54px; padding: 0 18px; border: 1.5px solid #82715f; background: transparent; color: #251e19; font-size: 16px; font-weight: 800; }
  .tile { width: calc(50% - 4.5px); }
  .tile span { float: right; font: 22px/1 Arial, sans-serif; color: #b74424; }
  .character { margin-top: 9px; }
  .character .arrow-small { top: 12px; color: #b74424; }
  .poster { position: absolute; left: 563px; top: 91px; width: 671px; height: 485px; }
  .image-frame { position: absolute; left: 0; top: 0; width: 671px; height: 485px; overflow: hidden; background: #c86236; clip-path: polygon(0 0, 100% 0, 100% 88%, 93% 100%, 0 100%); }
  .image-frame img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
  .image-frame::after { content: ""; position: absolute; inset: auto 0 0; height: 105px; background: linear-gradient(transparent, rgba(37,30,25,.76)); }
  .image-caption { position: absolute; left: 21px; right: 24px; bottom: 17px; z-index: 1; display: flex; justify-content: space-between; align-items: end; color: #fff8eb; }
  .image-caption strong { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .poster-foot { position: absolute; top: 500px; right: 0; }
  .checks { display: inline-block; width: 86px; height: 12px; background-color: #251e19; background-image: conic-gradient(#f3e9d5 25%, transparent 0 50%, #f3e9d5 0 75%, transparent 0); background-size: 12px 12px; }
  .footer { position: absolute; left: 46px; right: 46px; bottom: 25px; height: 76px; border-top: 2px solid #251e19; display: flex; align-items: center; }
  .settings { height: 43px; padding: 0 17px; border: 1px solid #81725f; background: transparent; color: #251e19; font-size: 13px; font-weight: 800; }
  .volume { display: flex; align-items: center; gap: 13px; margin-left: 23px; font-size: 13px; font-weight: 800; }
  .track { position: relative; width: 112px; height: 4px; background: #c2b49e; }
  .track::before { content: ""; position: absolute; left: 0; top: 0; width: 30%; height: 4px; background: #c94d29; }
  .track::after { content: ""; position: absolute; left: 30%; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: #c94d29; transform: translate(-50%, -50%); }
  .percent { color: #8a4b34; font: 800 12px/1 Arial, sans-serif; }
  .footer-right { display: flex; align-items: center; gap: 20px; margin-left: auto; }
  .exit { height: 43px; padding: 0 19px; border: 0; border-left: 1px solid #b5a791; background: transparent; color: #51473c; font-size: 13px; font-weight: 800; }
</style>
</head>
<body>
<main class="canvas">
  <header class="topline">
    <div class="brandline">HALLIGALLI RUN</div>
    <div class="topnote">02 · 시안</div>
  </header>

  <section class="identity" aria-label="게임 제목">
    <h1>할리갈리런</h1>
  </section>

  <nav class="menu" aria-label="메인 메뉴">
    <button class="primary"><strong>방 만들기</strong><small>친구 또는 AI와 · 2–6인</small><span class="arrow" aria-hidden="true">↗</span></button>
    <button class="secondary">초대코드로 참가 <span class="arrow-small" aria-hidden="true">↗</span></button>
    <div class="pair">
      <button class="tile">연습실 <span aria-hidden="true">↗</span></button>
      <button class="tile">맵 만들기 <span aria-hidden="true">↗</span></button>
    </div>
    <button class="character">내 캐릭터 꾸미기 <span class="arrow-small" aria-hidden="true">↗</span></button>
  </nav>

  <section class="poster" aria-label="게임 코스 이미지">
    <div class="image-frame">
      <img src="assets/course.png" alt="게임 속 사암 서프 코스">
      <div class="image-caption"><strong>왕의 회랑</strong></div>
    </div>
    <div class="poster-foot"><span class="checks" aria-hidden="true"></span></div>
  </section>

  <footer class="footer">
    <button class="settings">조작키 설정 ↗</button>
    <div class="volume"><span>배경 음악</span><span class="track" aria-hidden="true"></span><span class="percent">30%</span></div>
    <div class="footer-right"><button class="exit">종료 ↗</button></div>
  </footer>
</main>
</body>
</html>
