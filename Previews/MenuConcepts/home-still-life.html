<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=671, initial-scale=1">
<title>HalliGalliRun home still life</title>
<style>
  html, body { margin: 0; width: 671px; height: 485px; overflow: hidden; background: #DCE5D8; }
  .canvas { display: block; width: 671px; height: 485px; }
</style>
</head>
<body>
<canvas class="canvas" width="1342" height="970" aria-label="Two strawberry cards and a brass HalliGalli bell"></canvas>
<script>
  const canvas = document.querySelector('.canvas');
  const context = canvas.getContext('2d', { alpha: false });
  const scale = 2;
  context.scale(scale, scale);
  context.fillStyle = '#DCE5D8';
  context.fillRect(0, 0, 671, 485);
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = 'high';

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error(`Could not load ${source}`));
      image.src = source;
    });
  }

  function drawCard(image, x, y, angle) {
    const width = 190;
    const height = 295;
    context.save();
    context.translate(x + width / 2, y + height / 2);
    context.rotate(angle * Math.PI / 180);
    context.shadowColor = 'rgba(35, 48, 35, 0.19)';
    context.shadowOffsetX = 0;
    context.shadowOffsetY = 8 * scale;
    context.shadowBlur = 10 * scale;
    context.drawImage(image, -width / 2, -height / 2, width, height);
    context.restore();
  }

  window.artworkReady = Promise.all([
    loadImage('assets/strawberry-3.png'),
    loadImage('assets/strawberry-2.png'),
    loadImage('assets/bell.png')
  ]).then(([three, two, bell]) => {
    drawCard(three, 38, 87, -9);
    drawCard(two, 223, 81, 7);
    context.drawImage(bell, 363, 150, 350, 253);
    canvas.dataset.ready = 'true';
  });
</script>
</body>
</html>
